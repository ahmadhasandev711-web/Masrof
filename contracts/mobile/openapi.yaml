components:
  schemas:
    MobileError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
      additionalProperties: false
    MobileOk:
      type: object
      properties:
        ok:
          type: boolean
          const: true
      required:
        - ok
      additionalProperties: false
    MobileId:
      type: object
      properties:
        id:
          type: string
          minLength: 1
      required:
        - id
      additionalProperties: false
    MobileWorkspacesListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              type:
                type: string
              currency:
                type: string
              businessName:
                type:
                  - string
                  - null
              role:
                type: string
                enum:
                  - owner
                  - admin
                  - member
                  - viewer
            required:
              - id
              - name
              - type
              - currency
              - businessName
              - role
            additionalProperties: false
        activeWorkspaceId:
          type:
            - string
            - null
      required:
        - items
        - activeWorkspaceId
      additionalProperties: false
    MobileCreateWorkspaceResponse:
      type: object
      properties:
        workspaceId:
          type: string
      required:
        - workspaceId
      additionalProperties: false
    MobileBranding:
      type: object
      properties:
        businessName:
          type:
            - string
            - null
        logoUrl:
          type:
            - string
            - null
        taxId:
          type:
            - string
            - null
        businessPhone:
          type:
            - string
            - null
        businessAddress:
          type:
            - string
            - null
      required:
        - businessName
        - logoUrl
        - taxId
        - businessPhone
        - businessAddress
      additionalProperties: false
    MobileEntitlementsResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
            name:
              type:
                - string
                - null
            email:
              type:
                - string
                - null
          required:
            - id
          additionalProperties: false
        userId:
          type: string
        plan:
          type: string
        showAds:
          type: boolean
        isSuspended:
          type: boolean
        flags:
          type: object
          propertyNames:
            type: string
          additionalProperties:
            type: boolean
        limits:
          type: object
          properties:
            maxInvoicesPerMonth:
              type: number
            maxClients:
              type: number
            maxActiveProjects:
              type: number
            maxWorkspaces:
              type: number
          required:
            - maxInvoicesPerMonth
            - maxClients
            - maxActiveProjects
            - maxWorkspaces
          additionalProperties: false
      required:
        - user
        - userId
        - plan
        - showAds
        - isSuspended
        - flags
        - limits
      additionalProperties: false
    MobilePlanResponse:
      type: object
      properties:
        plan:
          type: string
        showAds:
          type: boolean
        isSuspended:
          type: boolean
        status:
          type: string
        expiresAt:
          type:
            - string
            - null
        planName:
          type: string
        features:
          type: object
          propertyNames:
            type: string
          additionalProperties:
{}
      required:
        - plan
        - showAds
        - isSuspended
        - status
        - expiresAt
        - planName
        - features
      additionalProperties: false
